<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Przejścia scen</title><style>
:root{color-scheme:dark;font:13px "Segoe UI",sans-serif;color:#eef0f5;background:#25272e}*{box-sizing:border-box}body{margin:0;padding:12px;min-width:240px}h1{font-size:16px;line-height:1.3;margin:3px 0 11px;overflow-wrap:anywhere}.eyebrow{color:#aeb3c0;font-size:10px;letter-spacing:1px}label.follow{display:flex;align-items:center;gap:7px;color:#cdd1db;font-size:12px;margin-bottom:8px}input[type=checkbox]{accent-color:#6b8cf5;margin:0}select,input[type=number]{width:100%;height:32px;border:1px solid #515563;border-radius:4px;background:#373b46;color:#f2f4fa;font:inherit;padding:4px 7px;outline:none}select:focus,input:focus{border-color:#8fa9ff;box-shadow:0 0 0 1px #8fa9ff}select{cursor:pointer}section{border-top:1px solid #424650;margin-top:13px;padding-top:10px}.section-title{font-size:12px;font-weight:600;margin:0 0 7px;color:#e5e9f4}.row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}.field label{display:block;font-size:11px;color:#b8becc;margin-bottom:4px}.hint{font-size:11px;line-height:1.4;color:#9fa8ba;margin-top:6px}.audio{font-size:11px;line-height:1.45;color:#c3ccdf;margin-top:13px;padding:8px;border-radius:4px;background:#2f333d}#status{font-size:11px;color:#a6d4b4;min-height:16px;margin-top:9px}.error{color:#f1b4ac!important}
</style><script src="panel-config.js"></script></head>
<body>
<div class="eyebrow" id="heading">SCENA NA PROGRAMIE</div><h1 id="title">Łączenie z OBS…</h1>
<label class="follow"><input id="follow" type="checkbox" checked>Podążaj za aktualną sceną</label>
<select id="scene" aria-label="Scena"></select>
<section><p class="section-title">Wyjście z tej sceny</p><div class="row"><div class="field"><label for="exit">Efekt</label><select id="exit"></select></div><div class="field"><label for="exit_ms">Czas · ms</label><input id="exit_ms" type="number" min="50" max="60000" step="50" value="1000"></div></div></section>
<section><p class="section-title">Wejście na tę scenę</p><div class="row"><div class="field"><label for="entry">Efekt</label><select id="entry"></select></div><div class="field"><label for="entry_ms">Czas · ms</label><input id="entry_ms" type="number" min="0" max="60000" step="50" value="0"></div></div><div class="hint">Własne wejście ma pierwszeństwo.<br>0 ms — odziedzicz czas poprzedniej sceny.</div></section>
<div class="audio">Zanikanie dźwięku: A ↓ i B ↑ równocześnie.<br>Wspólne źródła pozostają bez zmian.</div><div id="status">Łączenie…</div>
<script>
const $=id=>document.getElementById(id);let state=null,selected='',sceneSignature='',renderSignature='',busy=false,saving=false,timer;
const cfg=window.OBS_PANEL_CONFIG;
const headers={'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'};
function options(element,items){element.replaceChildren(...items.map(([text,value])=>{let o=document.createElement('option');o.textContent=text;o.value=value;o.title=text;return o}));}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function render(){if(!state?.ready)return;const list=state.scenes||[];let sig=JSON.stringify(list);if(sig!==sceneSignature){options($('scene'),list.map(s=>[s.name,s.uuid]));sceneSignature=sig;renderSignature=''}if($('follow').checked||!list.some(s=>s.uuid===selected))selected=state.current_uuid;const s=list.find(s=>s.uuid===selected);if(!s)return;$('scene').value=selected;$('heading').textContent=$('follow').checked?'SCENA NA PROGRAMIE':'USTAWIENIA SCENY';$('title').textContent=s.name;const r=state.rules||{},exitKey='exit_'+selected,entryKey='entry_'+selected;const signature=JSON.stringify([state.collection,selected,state.effects,r[exitKey],r[exitKey+'_ms'],r[entryKey],r[entryKey+'_ms']]);if(signature===renderSignature||saving)return;const isEditing=['exit_ms','entry_ms'].includes(document.activeElement?.id);if(isEditing&&renderSignature.startsWith(state.collection+'|'+selected))return;const kind=s.name==='Przerwa — Beyond the Sea'?'fade_transition':'move_transition';const def=state.effects.find(e=>e.kind===kind)?.name||state.effects.find(e=>e.kind==='fade_transition')?.name||'Zanikanie';options($('exit'),[['Domyślnie: '+def,''],...state.effects.map(e=>[e.name,e.name])]);options($('entry'),[['Wyjście poprzedniej sceny',''],...state.effects.map(e=>[e.name,e.name])]);$('exit').value=r[exitKey]||'';$('entry').value=r[entryKey]||'';$('exit_ms').value=r[exitKey+'_ms']||1000;$('entry_ms').value=r[entryKey+'_ms']||0;renderSignature=signature;status('Ustawienia zapisują się automatycznie');}
async function poll(){if(busy)return;busy=true;try{let response=await fetch(cfg.base+'/state',{headers});if(!response.ok)throw new Error('Brak połączenia');state=await response.json();render()}catch(error){status('Łączenie z OBS…',true)}finally{busy=false}}
async function save(){if(!state?.ready||!selected)return;saving=true;status('Zapisywanie…');try{let payload={collection:state.collection,scene:selected,exit:$('exit').value,exit_ms:Number($('exit_ms').value),entry:$('entry').value,entry_ms:Number($('entry_ms').value)};let response=await fetch(cfg.base+'/rules',{method:'POST',headers,body:JSON.stringify(payload)});let result=await response.json();if(!response.ok)throw new Error(result.error||'Błąd zapisu');const r=state.rules;r['exit_'+selected]=payload.exit;r['exit_'+selected+'_ms']=payload.exit_ms;r['entry_'+selected]=payload.entry;r['entry_'+selected+'_ms']=payload.entry_ms;renderSignature='';status('Zapisano')}catch(error){status(error.message,true)}finally{saving=false}}
$('follow').addEventListener('change',()=>{renderSignature='';render()});$('scene').addEventListener('change',()=>{$('follow').checked=false;selected=$('scene').value;renderSignature='';render()});for(const id of ['exit','entry','exit_ms','entry_ms'])$(id).addEventListener('change',save);setInterval(poll,200);poll();
</script></body></html>
